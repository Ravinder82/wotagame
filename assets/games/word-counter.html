<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#181b22;--line:#2d3139;--muted:#8b93a7;--text:#f4f6fb;--accent:#7cffb2;--accent2:#5eead4}
*{box-sizing:border-box;margin:0;padding:0}body{background:radial-gradient(ellipse 80% 50% at 20% -10%,#1a2e24 0,transparent 60%),var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:480px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
h1{font-size:20px;margin-bottom:4px;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
textarea{width:100%;min-height:140px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font:14px/1.6 monospace;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;color:var(--accent);letter-spacing:-.03em}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.modes{display:flex;gap:8px;margin-bottom:16px}
.mode{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.mode.active{background:var(--accent);color:#0a1a12;border-color:transparent}
.hint{margin-top:12px;font-size:11px;color:var(--muted);text-align:center}
</style></head><body>
<div class="wrap"><div class="card">
<h1>Word Counter</h1><p class="sub">Count words, characters, and sentences in real time.</p>
<div class="modes">
<button class="mode active" data-mode="words">Words</button>
<button class="mode" data-mode="chars">Chars</button>
<button class="mode" data-mode="sentences">Sentences</button>
</div>
<textarea id="input" placeholder="Start typing or paste text here..."></textarea>
<div class="stats">
<div class="stat"><div class="n" id="w">0</div><div class="l">Words</div></div>
<div class="stat"><div class="n" id="c">0</div><div class="l">Chars</div></div>
<div class="stat"><div class="n" id="s">0</div><div class="l">Sentences</div></div>
</div>
<div class="hint">Type or paste any text to see live counts.</div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const input=$('input');
function count(t){
  const words=t.trim()?t.trim().split(/\s+/).length:0;
  const chars=t.length;
  const sentences=t.split(/[.!?]+/).filter(x=>x.trim()).length;
  return{words,chars,sentences};
}
function update(){
  const v=input.value;
  const{words,chars,sentences}=count(v);
  $('w').textContent=words;
  $('c').textContent=chars;
  $('s').textContent=sentences;
}
input.addEventListener('input',update);
document.querySelectorAll('.mode').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const m=b.dataset.mode;
    const labels={words:'Words',chars:'Chars',sentences:'Sentences'};
    document.querySelectorAll('.stat .l').forEach((l,i)=>{
      const keys=['words','chars','sentences'];
      l.textContent=keys[i]===m?labels[m]:keys[i].charAt(0).toUpperCase()+keys[i].slice(1);
    });
  });
});
update();
</script></body></html>
