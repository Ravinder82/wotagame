<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">Picture Puzzle artwork</title><desc id="desc">A dramatic sunset over a mountain lake with illuminated jigsaw pieces drifting into place.</desc>
<defs>
