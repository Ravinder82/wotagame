 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#fbba8b"/><stop offset=".38" stop-color="#54738c"/><stop offset="1" stop-color="#101f39"/></linearGradient>
 <linearGradient id="mountain"><stop stop-color="#566e9c"/><stop offset="1" stop-color="#182344"/></linearGradient>
 <linearGradient id="pieceA" x2="1" y2="1"><stop stop-color="#fff0c5"/><stop offset="1" stop-color="#ee9c5b"/></linearGradient>
 <linearGradient id="pieceB" x2="1" y2="1"><stop stop-color="#b6f1cf"/><stop offset="1" stop-color="#37a9a4"/></linearGradient>
 <linearGradient id="pieceC" x2="1" y2="1"><stop stop-color="#a6d4ff"/><stop offset="1" stop-color="#5a7ee6"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff2be"/><stop offset=".4" stop-color="#ffc777" stop-opacity=".95"/><stop offset="1" stop-color="#f39162" stop-opacity="0"/></radialGradient>
