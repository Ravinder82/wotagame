<rect width="480" height="340" fill="url(#grain)" opacity=".35"/><rect x=".75" y=".75" width="478.5" height="338.5" rx="18" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/>
</svg>