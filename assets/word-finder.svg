<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">Word Finder artwork</title><desc id="desc">A midnight-blue letter grid with neon green highlighted word paths and cool cyan glow.</desc>
<defs>
 <linearGradient id="gridBg" x2="1" y2="1"><stop stop-color="#0a2946"/><stop offset=".52" stop-color="#081423"/><stop offset="1" stop-color="#101e39"/></linearGradient>
 <radialGradient id="gridGlow"><stop stop-color="#9cf866" stop-opacity=".28"/><stop offset="1" stop-color="#9cf866" stop-opacity="0"/></radialGradient>
 <linearGradient id="path" x2="1" y2="0"><stop stop-color="#9cf866" stop-opacity=".1"/><stop offset=".5" stop-color="#9cf866" stop-opacity=".35"/><stop offset="1" stop-color="#68eac8" stop-opacity=".15"/></linearGradient>
 <filter id="neon"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="43" height="42" patternUnits="userSpaceOnUse"><path d="M43 0H0V42" fill="none" stroke="#4a7196" stroke-opacity=".6" stroke-width="1"/></pattern>
 <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r=".7" fill="#fff" opacity=".16"/><circle cx="18" cy="21" r=".5" fill="#fff" opacity=".12"/></pattern>
</defs>
<rect width="480" height="340" fill="url(#gridBg)"/><ellipse cx="240" cy="170" rx="235" ry="190" fill="url(#gridGlow)"/>
<rect x="17" y="20" width="446" height="300" rx="17" fill="#08111d" stroke="#48708d" stroke-opacity=".85" stroke-width="2"/><rect x="25" y="28" width="430" height="284" rx="10" fill="url(#grid)"/>
<g fill="#a9c4dc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700" text-anchor="middle">
<text x="46" y="56">X</text><text x="89" y="56">P</text><text x="132" y="56">L</text><text x="175" y="56">A</text><text x="218" y="56">Y</text><text x="261" y="56">F</text><text x="304" y="56">U</text><text x="347" y="56">N</text><text x="390" y="56">N</text><text x="433" y="56">C</text>
<text x="46" y="98">G</text><text x="89" y="98">A</text><text x="132" y="98">M</text><text x="175" y="98">E</text><text x="218" y="98">S</text><text x="261" y="98">H</text><text x="304" y="98">A</text><text x="347" y="98">R</text><text x="390" y="98">E</text><text x="433" y="98">B</text>
<text x="46" y="140">F</text><text x="89" y="140">I</text><text x="132" y="140">N</text><text x="175" y="140">D</text><text x="218" y="140">C</text><text x="261" y="140">H</text><text x="304" y="140">A</text><text x="347" y="140">L</text><text x="390" y="140">L</text><text x="433" y="140">E</text>
<text x="46" y="182">P</text><text x="89" y="182">U</text><text x="132" y="182">Z</text><text x="175" y="182">Z</text><text x="218" y="182">L</text><text x="261" y="182">E</text><text x="304" y="182">B</text><text x="347" y="182">R</text><text x="390" y="182">A</text><text x="433" y="182">I</text>
<text x="46" y="224">W</text><text x="89" y="224">O</text><text x="132" y="224">R</text><text x="175" y="224">D</text><text x="218" y="224">S</text><text x="261" y="224">D</text><text x="304" y="224">A</text><text x="347" y="224">I</text><text x="390" y="224">L</text><text x="433" y="224">Y</text>
<text x="46" y="266">B</text><text x="89" y="266">R</text><text x="132" y="266">A</text><text x="175" y="266">I</text><text x="218" y="266">N</text><text x="261" y="266">G</text><text x="304" y="266">A</text><text x="347" y="266">M</text><text x="390" y="266">E</text><text x="433" y="266">S</text>
</g>
<rect x="28" y="197" width="199" height="36" rx="12" fill="url(#path)" stroke="#a9f866" stroke-width="2.5" filter="url(#neon)"/><path d="M47 215H209" stroke="#b8ff8a" stroke-opacity=".2" stroke-width="25" stroke-linecap="round"/><text x="46" y="224" fill="#e1ffc8" font-family="ui-monospace,monospace" font-size="19" font-weight="900" letter-spacing="2">W O R D S</text>
